services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oblihub
      POSTGRES_USER: oblihub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oblihub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Tailscale sidecar. Opt-in via the "tailscale" compose profile:
  #   docker compose --profile tailscale up -d
  # Provide TAILSCALE_AUTHKEY (one-shot or reusable) and TAILSCALE_HOSTNAME in .env.
  # When enabled, the server + proxy join your private Tailnet and can reach remote
  # Docker engines / advertised subnets directly. When the profile is omitted the
  # sidecar is never started and everything keeps working with public IPs / SSH.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TAILSCALE_HOSTNAME:-oblihub}
    restart: unless-stopped
    profiles: [tailscale]
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-oblihub}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TAILSCALE_EXTRA_ARGS:-}
      TS_ACCEPT_DNS: "true"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_run:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  server:
    image: meejay/oblihub-server:${OBLIHUB_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgres://oblihub:${DB_PASSWORD:-changeme}@postgres:5432/oblihub
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      DOCKER_SOCKET: /var/run/docker.sock
      ALLOW_CONSOLE: ${ALLOW_CONSOLE:-false}
      ALLOW_STACK: ${ALLOW_STACK:-false}
      ALLOW_NGINX: ${ALLOW_NGINX:-false}
      STACKS_DIR: /data/stacks
      APP_NAME: ${APP_NAME:-Oblihub}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-30000}
      DEFAULT_CHECK_INTERVAL: ${DEFAULT_CHECK_INTERVAL:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - stacks_data:/data/stacks
      - proxy_data:/data/stacks/_proxy
      # Tailscale LocalAPI socket — read-only is enough for status queries.
      # The volume is always declared but only populated when the tailscale
      # profile is active. Server gracefully degrades when the socket is absent.
      - tailscale_run:/var/run/tailscale:ro

  client:
    image: meejay/oblihub-client:${OBLIHUB_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-3100}:80"
      - "${LISTEN_PORT_HTTPS:-3101}:443"
    volumes:
      - client_ssl:/etc/nginx/ssl

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      oblihub.proxy: "true"
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    # When PROXY_USE_TAILSCALE=service:tailscale is set in .env, the proxy joins
    # the Tailscale network namespace and can reach Tailnet subnet routes directly
    # (lets you target container bridge IPs on remote engines without published
    # ports). Default is "bridge" — standard Docker networking, no Tailscale.
    network_mode: ${PROXY_NETWORK_MODE:-bridge}
    volumes:
      - proxy_data:/etc/nginx
    entrypoint: ["/bin/sh", "-c", "mkdir -p /etc/nginx/conf.d /etc/nginx/stream.d /etc/nginx/certs /etc/nginx/acme-challenge /etc/nginx/htpasswd && [ -f /etc/nginx/nginx.conf ] || echo 'events { worker_connections 1024; } http { server { listen 80 default_server; location / { return 444; } } }' > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  stacks_data:
  proxy_data:
  client_ssl:
  tailscale_state:
  tailscale_run:
